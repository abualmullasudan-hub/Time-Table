name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'

    # 1. إنشاء مجلد Android أولاً
    - name: Create Android Platform
      run: flutter create --project-name time_table . --platforms=android

    # 2. تثبيت NDK وقبول التراخيص
    - name: Install NDK and Accept Licenses
      run: |
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125"

    # 3. إجبار المشروع على استخدام الإصدارات المتوافقة (هذه هي الخطوة الحاسمة)
    - name: Configure Android Versions
      run: |
        sed -i 's/ndkVersion .*/ndkVersion "26.1.10909125"/g' android/app/build.gradle
        sed -i 's/compileSdkVersion .*/compileSdkVersion 35/g' android/app/build.gradle
        sed -i 's/targetSdkVersion .*/targetSdkVersion 35/g' android/app/build.gradle

    - name: Install dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
