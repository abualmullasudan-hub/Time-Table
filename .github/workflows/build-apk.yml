name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.5'
        channel: 'stable'

    - name: Create Android platform folder
      run: |
        flutter create --project-name time_table . --platforms=android
        rm -f test/widget_test.dart

    # توليد الأيقونة تلقائياً
    - name: Generate Icon Image
      run: |
        sudo apt-get install -y imagemagick
        mkdir -p assets
        convert -size 1024x1024 xc:"#1565C0" -fill white -draw "roundrectangle 150,200 874,874 50,50" -fill "#1565C0" -draw "rectangle 150,200 874,350" -fill white -pointsize 400 -gravity center -annotate +0+100 "8" assets/icon.png

    - name: Install dependencies
      run: flutter pub get

    - name: Generate App Icons
      run: dart run flutter_launcher_icons

    - name: Clean Project
      run: flutter clean

    - name: Install dependencies again
      run: flutter pub get

    - name: Configure Android Versions
      run: |
        sed -i 's/ndkVersion .*/ndkVersion "26.1.10909125"/g' android/app/build.gradle
        sed -i 's/compileSdkVersion .*/compileSdkVersion 34/g' android/app/build.gradle
        sed -i 's/targetSdkVersion .*/targetSdkVersion 34/g' android/app/build.gradle
        sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-all.zip|' android/gradle/wrapper/gradle-wrapper.properties

    - name: Install NDK
      run: |
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125"

    - name: Analyze Code
      run: flutter analyze

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
